<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadEra Vocabulary Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ReadEra Vocabulary Viewer</h1>
            <div class="controls">
                <label for="fileInput" class="custom-file-upload">
                    Choose File
                </label>
                <input type="file" id="fileInput" accept=".json">
                <div class="sort-control">
                    <label for="sortSelect">Sort by:</label>
                    <select id="sortSelect">
                        <option value="alphabetical">Alphabetical</option>
                        <option value="frequency_desc">Most Common First</option>
                        <option value="frequency_asc">Rare Words First</option>
                        <option value="examples" selected>Number of Examples</option>
                        <option value="ratio">Ratio (Position in Book)</option>
                        <option value="date_desc">Newest First</option>
                        <option value="date_asc">Oldest First</option>
                    </select>
                </div>
                <div class="anki-controls">
                    <label class="anki-toggle">
                        <input type="checkbox" id="hideAnkiToggle"> Hide words already in Anki
                    </label>
                    <button id="syncAnkiBtn">Sync Anki</button>
                    <span id="ankiStatus" class="status-dot" title="Anki connection status"></span>
                </div>
                <div class="group-control">
                    <label class="group-toggle">
                        <input type="checkbox" id="groupWordsToggle"> Group similar words
                    </label>
                </div>
                <div class="search-all-control">
                    <label class="search-all-toggle">
                        <input type="checkbox" id="searchAllExamplesToggle"> Search all examples
                    </label>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search words...">
                <div class="add-word-box">
                    <input type="text" id="addWordInput" placeholder="Add new word...">
                    <button id="addWordBtn">Add</button>
                </div>
                <div id="wordCounter" class="word-counter"></div>
                <button id="toggleBookListBtn" class="icon-btn" title="Manage Books">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3,4H21V6H3V4M3,9H21V11H3V9M3,14H21V16H3V14M3,19H21V21H3V19Z"/></svg>
                </button>
                <button id="optionsBtn" class="icon-btn" title="Options">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.97 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.97 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.95C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
                </button>
            </div>
        </header>
        <div id="ankiModeBar" class="anki-mode-bar" style="display: none;">
            <hr class="anki-bar-hr">
            <div class="anki-bar-content">
                <div class="deck-selector-container">
                    <label for="deckSelect">Deck:</label>
                    <select id="deckSelect"></select>
                </div>
                <div class="anki-bar-actions">
                    <button id="addCardBtn" class="primary-btn">Add</button>
                    <button id="cancelAnkiBtn" class="secondary-btn">Back</button>
                </div>
            </div>
        </div>
        <div class="content-wrapper">
            <div id="ankiCardPreview" class="anki-card-preview-left" style="display: none;">
                <h3>Card Preview</h3>
                <div class="preview-container-vertical">
                    <div class="preview-field">
                        <label>Name (Front)</label>
                        <div id="previewName" class="preview-box preview-box-small"></div>
                    </div>
                    <div class="preview-field">
                        <label>Context</label>
                        <div id="previewContext" class="preview-box"></div>
                    </div>
                    <div id="stickyBackField" class="preview-field">
                        <label>Back</label>
                        <div id="previewBack" class="preview-box"></div>
                    </div>
                </div>
            </div>
            <main id="wordList">
                <p class="message">Loading library...</p>
            </main>
            <aside id="dictionaryContainer">
                <div id="ankiCardMode" class="anki-card-mode-right" style="display: none;">
                    <div id="activeWordContainer" class="active-word-container"></div>
                </div>
                <div class="dict-tabs">
                    <button class="dict-tab active" data-dict="cambridge">Cambridge</button>
                    <button class="dict-tab" data-dict="merriam">Merriam-Webster</button>
                </div>
                <div id="dictionaryView">
                    <div class="dictionary-placeholder">
                        <p>Click on a word to see its definition</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="optionsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Options</h2>
                <span class="close">&times;</span>
            </div>
            <div id="optionsList" class="options-list">
                <!-- Options will be loaded here -->
            </div>
        </div>
    </div>

    <script src="clipboard.js"></script>
    <script src="options.js"></script>
    <script src="anki_editor.js"></script>
    <script src="app.js"></script>
</body>
</html>
