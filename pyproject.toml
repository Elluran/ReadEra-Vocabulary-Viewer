[project]
name = "readera-backup-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "nltk>=3.9.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
readera-server = "app.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
